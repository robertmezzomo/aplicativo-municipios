<title>Aniversários dos Municípios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root {
  --bg: #f7f4ee;
  --surface: #fdfbf7;
  --raised: #efe9df;
  --line: rgba(31,27,22,0.08);
  --fg: #1f1b16;
  --secondary: #5e554a;
  --muted: #7b7266;
  --accent: #b45309;
  --accent-soft: rgba(180,83,9,0.08);
  --positive: #16a34a;
  --positive-soft: rgba(22,163,74,0.08);
  --festa: #b45309;
  --festa-soft: rgba(180,83,9,0.07);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --sans: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513;
    --surface: #1c1a18;
    --raised: #262421;
    --line: rgba(239,233,222,0.08);
    --fg: #efe9de;
    --secondary: #aaa398;
    --muted: #8a847a;
    --accent: #e59c2f;
    --accent-soft: rgba(229,156,47,0.1);
    --positive: #4cc38a;
    --positive-soft: rgba(76,195,138,0.1);
    --festa: #e59c2f;
    --festa-soft: rgba(229,156,47,0.08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161513;
  --surface: #1c1a18;
  --raised: #262421;
  --line: rgba(239,233,222,0.08);
  --fg: #efe9de;
  --secondary: #aaa398;
  --muted: #8a847a;
  --accent: #e59c2f;
  --accent-soft: rgba(229,156,47,0.1);
  --positive: #4cc38a;
  --positive-soft: rgba(76,195,138,0.1);
  --festa: #e59c2f;
  --festa-soft: rgba(229,156,47,0.08);
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
* { box-sizing: border-box; }

.wrap { max-width: 1080px; margin: 0 auto; }

.header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--line);
}
.header-top {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
h1 {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 500;
  margin: 0;
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.header-date {
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.filters select, .filters input[type="text"] {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 400;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--fg);
  outline: none;
  min-width: 0;
  transition: border-color 0.15s var(--ease);
}
.filters select:focus, .filters input:focus {
  border-color: var(--accent);
}
.filters select { cursor: pointer; }
.search-input { flex: 1 1 160px; max-width: 260px; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}
.pill-group {
  display: flex;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 2px;
}
.pill-btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
}
.pill-btn:hover { color: var(--secondary); }
.pill-btn.active {
  background: var(--fg);
  color: var(--bg);
}
.festa-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--secondary);
  user-select: none;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease);
  font-family: var(--sans);
}
.festa-toggle:hover { border-color: var(--accent); color: var(--accent); }
.festa-toggle.active {
  background: var(--festa-soft);
  color: var(--festa);
  border-color: var(--festa);
}
.festa-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--festa);
  flex-shrink: 0;
}

.stats {
  display: flex;
  gap: 24px;
  padding: 16px 0 12px;
  font-size: 13px;
  color: var(--muted);
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}
.stats strong {
  color: var(--fg);
  font-weight: 500;
}
.stat-sep { color: var(--line); }
.stat-today { color: var(--positive); }
.stat-festa { color: var(--festa); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
  padding-block: 8px 40px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  display: grid;
  grid-template-columns: 3px 1fr;
  gap: 0 12px;
  transition: box-shadow 0.15s var(--ease);
  position: relative;
}
.card:hover {
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.card-bar {
  grid-row: 1 / -1;
  border-radius: 2px;
  background: var(--raised);
  align-self: stretch;
  transition: background 0.15s var(--ease);
}
.card.is-today .card-bar { background: var(--positive); }
.card.is-week .card-bar { background: var(--accent); }
.card.is-month .card-bar { background: var(--muted); opacity: 0.4; }

.card-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.card-row-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.city-name {
  font-weight: 500;
  font-size: 14px;
  line-height: 1.3;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.days-label {
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.days-label.today { color: var(--positive); }
.days-label.soon { color: var(--accent); }
.days-label.later { color: var(--muted); }

.card-row-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1;
}
.uf-label {
  font-weight: 500;
  letter-spacing: 0.02em;
}
.meta-dot {
  width: 2px; height: 2px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  opacity: 0.5;
}

.card-row-date {
  font-size: 13px;
  color: var(--secondary);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.festa-tag {
  display: none;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--festa);
  margin-top: 4px;
}
.card.has-festa .festa-tag { display: flex; }

.card-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--secondary);
  cursor: pointer;
  text-decoration: none;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease), background 0.15s var(--ease);
  line-height: 1;
}
.action-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.action-btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}
.action-btn.insta-btn:hover {
  border-color: #c13584;
  color: #c13584;
}

.empty {
  text-align: center;
  padding: 48px 16px;
  color: var(--muted);
  font-size: 14px;
  grid-column: 1 / -1;
}
.empty-label {
  font-size: 13px;
  margin-top: 4px;
}

@media (max-width: 500px) {
  .grid { grid-template-columns: 1fr; }
  .search-input { max-width: none; flex: 1 1 100%; }
  h1 { font-size: 20px; }
  .stats { gap: 16px; }
}
</style>

<div class="wrap">
  <div class="header">
    <div class="header-top">
      <h1>Aniversários dos Municípios</h1>
      <span class="header-date" id="todayDate"></span>
    </div>
    <div class="filters">
      <select id="filterRegiao">
        <option value="">Todas as regiões</option>
        <option value="N">Norte</option>
        <option value="NE">Nordeste</option>
        <option value="CO">Centro-Oeste</option>
        <option value="SE">Sudeste</option>
        <option value="S">Sul</option>
      </select>
      <select id="filterUF">
        <option value="">Todos os estados</option>
      </select>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar município">
    </div>
    <div class="controls">
      <div class="pill-group" id="proxPills">
        <button class="pill-btn active" data-days="0">Todos</button>
        <button class="pill-btn" data-days="7">7 d</button>
        <button class="pill-btn" data-days="15">15 d</button>
        <button class="pill-btn" data-days="30">30 d</button>
        <button class="pill-btn" data-days="90">90 d</button>
      </div>
      <button class="festa-toggle" id="festaToggle">
        <span class="festa-dot"></span>
        Com festa agendada
      </button>
    </div>
  </div>

  <div class="stats" id="statsBar"></div>
  <div class="grid" id="grid"></div>
</div>

<script src="dados.js"></script>
<script>
(function(){
  var today = new Date();
  today.setHours(0,0,0,0);
  var MESES_FULL = ["","janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

  document.getElementById("todayDate").textContent =
    today.getDate() + " de " + MESES_FULL[today.getMonth()+1] + " de " + today.getFullYear();

  function daysUntil(d, m) {
    var y = today.getFullYear();
    var next = new Date(y, m-1, d);
    next.setHours(0,0,0,0);
    if (next < today) next = new Date(y+1, m-1, d);
    return Math.round((next - today) / 86400000);
  }

  var data = MUNICIPIOS.map(function(r) {
    return {
      nome: r[0], uf: r[1], regiao: REGIOES[r[1]], nomeUF: NOMES_UF[r[1]],
      dia: r[2], mes: r[3], festa: !!r[4], instagram: r[5] || "",
      diasAte: daysUntil(r[2], r[3]),
      dataFmt: r[2] + " de " + MESES_FULL[r[3]]
    };
  });

  var ufSelect = document.getElementById("filterUF");
  var ufs = [];
  var seen = {};
  data.forEach(function(d){ if(!seen[d.uf]){seen[d.uf]=1;ufs.push(d.uf);} });
  ufs.sort(function(a,b){return NOMES_UF[a].localeCompare(NOMES_UF[b]);});
  ufs.forEach(function(uf) {
    var o = document.createElement("option");
    o.value = uf; o.textContent = NOMES_UF[uf] + " (" + uf + ")";
    ufSelect.appendChild(o);
  });

  function buildCalUrl(m) {
    var y = today.getFullYear();
    var d = new Date(y, m.mes-1, m.dia);
    if (d < today) d = new Date(y+1, m.mes-1, m.dia);
    var yy = d.getFullYear();
    var mm = String(m.mes).padStart(2,"0");
    var dd = String(m.dia).padStart(2,"0");
    var nextDay = new Date(d); nextDay.setDate(nextDay.getDate()+1);
    var mm2 = String(nextDay.getMonth()+1).padStart(2,"0");
    var dd2 = String(nextDay.getDate()).padStart(2,"0");
    var yy2 = nextDay.getFullYear();
    var title = encodeURIComponent("Aniversário de " + m.nome + " (" + m.uf + ")");
    var details = encodeURIComponent("Aniversário do município de " + m.nome + ", " + m.nomeUF + "." + (m.festa ? " Festa de aniversário agendada." : ""));
    var loc = encodeURIComponent(m.nome + ", " + m.uf);
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + title +
      "&dates=" + yy + mm + dd + "/" + yy2 + mm2 + dd2 +
      "&details=" + details + "&location=" + loc;
  }

  var fRegiao = "", fUF = "", fSearch = "", fProx = 0, fFesta = false;
  var grid = document.getElementById("grid");
  var statsBar = document.getElementById("statsBar");

  function render() {
    var f = data;
    if (fRegiao) f = f.filter(function(d){return d.regiao===fRegiao;});
    if (fUF) f = f.filter(function(d){return d.uf===fUF;});
    if (fSearch) {
      var q = fSearch.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
      f = f.filter(function(d){
        return d.nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").indexOf(q)>=0;
      });
    }
    if (fProx > 0) f = f.filter(function(d){return d.diasAte<=fProx;});
    if (fFesta) f = f.filter(function(d){return d.festa;});
    f.sort(function(a,b){return a.diasAte-b.diasAte;});

    var festaCount=0, hojeCt=0, semCt=0;
    f.forEach(function(d){
      if(d.festa) festaCount++;
      if(d.diasAte===0) hojeCt++;
      else if(d.diasAte<=7) semCt++;
    });

    var s = "<span><strong>"+f.length+"</strong> municípios</span>";
    if(hojeCt) s += '<span class="stat-sep">·</span><span class="stat-today"><strong>'+hojeCt+'</strong> hoje</span>';
    if(semCt) s += '<span class="stat-sep">·</span><span><strong>'+semCt+'</strong> em 7 dias</span>';
    s += '<span class="stat-sep">·</span><span class="stat-festa"><strong>'+festaCount+'</strong> com festa</span>';
    statsBar.innerHTML = s;

    if(!f.length){
      grid.innerHTML = '<div class="empty">Nenhum município encontrado<div class="empty-label">Tente ajustar os filtros</div></div>';
      return;
    }

    var html = "";
    for(var i=0;i<f.length;i++){
      var m = f[i];
      var isToday = m.diasAte===0;
      var isWeek = m.diasAte>0 && m.diasAte<=7;
      var isMonth = m.diasAte>7 && m.diasAte<=30;
      var cls = "card";
      if(isToday) cls+=" is-today";
      else if(isWeek) cls+=" is-week";
      else if(isMonth) cls+=" is-month";
      if(m.festa) cls+=" has-festa";

      var dCls = "days-label";
      var dTxt;
      if(isToday){ dCls+=" today"; dTxt="Hoje"; }
      else if(m.diasAte<=30){ dCls+=" soon"; dTxt=m.diasAte+" d"; }
      else{ dCls+=" later"; dTxt=m.diasAte+" d"; }

      var calUrl = buildCalUrl(m);
      var instaHtml = m.instagram ?
        '<a class="action-btn insta-btn" href="'+m.instagram+'" target="_blank" rel="noopener">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>' +
          'Evento' +
        '</a>' : '';

      html += '<div class="'+cls+'">' +
        '<div class="card-bar"></div>' +
        '<div class="card-body">' +
          '<div class="card-row-top">' +
            '<span class="city-name">'+m.nome+'</span>' +
            '<span class="'+dCls+'">'+dTxt+'</span>' +
          '</div>' +
          '<div class="card-row-meta">' +
            '<span class="uf-label">'+m.uf+'</span>' +
            '<span class="meta-dot"></span>' +
            '<span>'+NOMES_REGIAO[m.regiao]+'</span>' +
            '<span class="meta-dot"></span>' +
            '<span>'+m.nomeUF+'</span>' +
          '</div>' +
          '<div class="card-row-date">'+m.dataFmt+'</div>' +
          '<div class="festa-tag"><span class="festa-dot"></span> Festa agendada</div>' +
          '<div class="card-actions">' +
            '<a class="action-btn" href="'+calUrl+'" target="_blank" rel="noopener">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
              'Adicionar ao calendário' +
            '</a>' +
            instaHtml +
          '</div>' +
        '</div>' +
      '</div>';
    }
    grid.innerHTML = html;
  }

  document.getElementById("filterRegiao").addEventListener("change", function(){
    fRegiao = this.value;
    var opts = ufSelect.querySelectorAll("option");
    for(var i=0;i<opts.length;i++){
      var o=opts[i];
      if(!o.value){o.style.display="";continue;}
      if(!fRegiao){o.style.display="";continue;}
      o.style.display = REGIOES[o.value]===fRegiao?"":"none";
    }
    if(fUF && fRegiao && REGIOES[fUF]!==fRegiao){fUF="";ufSelect.value="";}
    render();
  });
  document.getElementById("filterUF").addEventListener("change",function(){fUF=this.value;render();});
  document.getElementById("searchInput").addEventListener("input",function(){fSearch=this.value.trim();render();});
  document.getElementById("festaToggle").addEventListener("click",function(){
    fFesta=!fFesta;
    this.classList.toggle("active",fFesta);
    render();
  });
  document.querySelectorAll(".pill-btn").forEach(function(btn){
    btn.addEventListener("click",function(){
      document.querySelectorAll(".pill-btn").forEach(function(b){b.classList.remove("active");});
      this.classList.add("active");
      fProx=parseInt(this.dataset.days);
      render();
    });
  });

  render();
})();
</script>
