<title>Eventos Municipais</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root {
  --bg: #f7f4ee;
  --surface: #fdfbf7;
  --raised: #efe9df;
  --line: rgba(31,27,22,0.08);
  --fg: #1f1b16;
  --secondary: #5e554a;
  --muted: #7b7266;
  --accent: #b45309;
  --accent-soft: rgba(180,83,9,0.08);
  --positive: #16a34a;
  --positive-soft: rgba(22,163,74,0.08);
  --festa: #b45309;
  --festa-soft: rgba(180,83,9,0.07);
  --expo: #0369a1;
  --expo-soft: rgba(3,105,161,0.08);
  --fest: #7c3aed;
  --fest-soft: rgba(124,58,237,0.08);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --sans: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513;
    --surface: #1c1a18;
    --raised: #262421;
    --line: rgba(239,233,222,0.08);
    --fg: #efe9de;
    --secondary: #aaa398;
    --muted: #8a847a;
    --accent: #e59c2f;
    --accent-soft: rgba(229,156,47,0.1);
    --positive: #4cc38a;
    --positive-soft: rgba(76,195,138,0.1);
    --festa: #e59c2f;
    --festa-soft: rgba(229,156,47,0.08);
    --expo: #38bdf8;
    --expo-soft: rgba(56,189,248,0.1);
    --fest: #a78bfa;
    --fest-soft: rgba(167,139,250,0.1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161513;
  --surface: #1c1a18;
  --raised: #262421;
  --line: rgba(239,233,222,0.08);
  --fg: #efe9de;
  --secondary: #aaa398;
  --muted: #8a847a;
  --accent: #e59c2f;
  --accent-soft: rgba(229,156,47,0.1);
  --positive: #4cc38a;
  --positive-soft: rgba(76,195,138,0.1);
  --festa: #e59c2f;
  --festa-soft: rgba(229,156,47,0.08);
  --expo: #38bdf8;
  --expo-soft: rgba(56,189,248,0.1);
  --fest: #a78bfa;
  --fest-soft: rgba(167,139,250,0.1);
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
* { box-sizing: border-box; }

.wrap { max-width: 1080px; margin: 0 auto; }

.header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding: 20px 0 16px;
  border-bottom: 1px solid var(--line);
}
.header-top {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
h1 {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 500;
  margin: 0;
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.header-sub {
  font-size: 12px;
  color: var(--muted);
}
.header-date {
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.tab-bar {
  display: flex;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 2px;
  margin-bottom: 16px;
  width: fit-content;
}
.tab-btn {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
}
.tab-btn:hover { color: var(--secondary); }
.tab-btn.active {
  background: var(--fg);
  color: var(--bg);
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.filters select, .filters input[type="text"] {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 400;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--fg);
  outline: none;
  min-width: 0;
  transition: border-color 0.15s var(--ease);
}
.filters select:focus, .filters input:focus {
  border-color: var(--accent);
}
.filters select { cursor: pointer; }
.search-input { flex: 1 1 160px; max-width: 260px; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-top: 12px;
}
.pill-group {
  display: flex;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 2px;
}
.pill-btn {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.15s var(--ease), color 0.15s var(--ease);
}
.pill-btn:hover { color: var(--secondary); }
.pill-btn.active {
  background: var(--fg);
  color: var(--bg);
}
.shows-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--secondary);
  user-select: none;
  transition: background 0.15s var(--ease), color 0.15s var(--ease), border-color 0.15s var(--ease);
  font-family: var(--sans);
}
.shows-toggle:hover { border-color: var(--accent); color: var(--accent); }
.shows-toggle.active {
  background: var(--festa-soft);
  color: var(--festa);
  border-color: var(--festa);
}
.festa-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--festa);
  flex-shrink: 0;
}

.stats {
  display: flex;
  gap: 24px;
  padding: 16px 0 12px;
  font-size: 13px;
  color: var(--muted);
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}
.stats strong {
  color: var(--fg);
  font-weight: 500;
}
.stat-sep { color: var(--line); }
.stat-today { color: var(--positive); }
.stat-shows { color: var(--festa); }

.view-lista, .view-calendario { display: none; }
.view-lista.active, .view-calendario.active { display: block; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
  padding-block: 8px 40px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  display: grid;
  grid-template-columns: 3px 1fr;
  gap: 0 12px;
  transition: box-shadow 0.15s var(--ease);
  position: relative;
}
.card:hover {
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
.card-bar {
  grid-row: 1 / -1;
  border-radius: 2px;
  background: var(--raised);
  align-self: stretch;
  transition: background 0.15s var(--ease);
}
.card.is-today .card-bar { background: var(--positive); }
.card.is-week .card-bar { background: var(--accent); }
.card.is-month .card-bar { background: var(--muted); opacity: 0.4; }

.card-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.card-row-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.city-name {
  font-weight: 500;
  font-size: 14px;
  line-height: 1.3;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.days-label {
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.days-label.today { color: var(--positive); }
.days-label.soon { color: var(--accent); }
.days-label.later { color: var(--muted); }

.event-name {
  font-size: 12px;
  color: var(--secondary);
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card-row-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1;
}
.uf-label {
  font-weight: 500;
  letter-spacing: 0.02em;
}
.meta-dot {
  width: 2px; height: 2px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
  opacity: 0.5;
}

.card-row-date {
  font-size: 13px;
  color: var(--secondary);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.type-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 500;
  padding: 2px 6px;
  border-radius: 3px;
  margin-top: 4px;
  width: fit-content;
}
.type-tag.tag-aniv {
  background: var(--accent-soft);
  color: var(--accent);
}
.type-tag.tag-expo {
  background: var(--expo-soft);
  color: var(--expo);
}
.type-tag.tag-fest {
  background: var(--fest-soft);
  color: var(--fest);
}

.shows-tag {
  display: none;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--festa);
  margin-top: 2px;
}
.card.has-shows .shows-tag { display: flex; }

.card-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  align-items: center;
}
.link-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: color 0.15s var(--ease);
}
.link-icon:hover {
  color: var(--accent);
}
.link-icon svg {
  width: 18px;
  height: 18px;
}

.empty {
  text-align: center;
  padding: 48px 16px;
  color: var(--muted);
  font-size: 14px;
  grid-column: 1 / -1;
}
.empty-label {
  font-size: 13px;
  margin-top: 4px;
}

/* Calendar */
.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
}
.cal-nav {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--secondary);
  cursor: pointer;
  transition: border-color 0.15s var(--ease), color 0.15s var(--ease);
}
.cal-nav:hover { border-color: var(--accent); color: var(--accent); }
.cal-month-label {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 500;
  text-transform: capitalize;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  overflow: hidden;
  margin-bottom: 40px;
}
.cal-dow {
  background: var(--raised);
  text-align: center;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  padding: 8px 4px;
  text-transform: lowercase;
}
.cal-cell {
  background: var(--surface);
  min-height: 80px;
  padding: 4px;
  vertical-align: top;
  position: relative;
  cursor: default;
}
.cal-cell.empty-cell {
  background: var(--bg);
  cursor: default;
}
.cal-cell.is-today-cell {
  background: var(--positive-soft);
}
.cal-day-num {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  padding: 2px 4px;
  font-variant-numeric: tabular-nums;
}
.cal-cell.is-today-cell .cal-day-num {
  color: var(--positive);
  font-weight: 600;
}
.cal-entries {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 2px;
}
.cal-entry {
  font-size: 10px;
  line-height: 1.3;
  padding: 2px 4px;
  border-radius: 3px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: default;
}
.cal-entry.cal-aniv {
  background: var(--accent-soft);
  color: var(--accent);
}
.cal-entry.cal-expo {
  background: var(--expo-soft);
  color: var(--expo);
}
.cal-entry.cal-fest {
  background: var(--fest-soft);
  color: var(--fest);
}
.cal-more {
  font-size: 10px;
  color: var(--muted);
  padding: 1px 4px;
  cursor: pointer;
}
.cal-more:hover { color: var(--accent); }

.cal-tooltip {
  display: none;
  position: fixed;
  z-index: 20;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  max-width: 280px;
  min-width: 200px;
}
.cal-tooltip.show { display: block; }
.cal-tooltip-title {
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--fg);
}
.cal-tooltip-item {
  font-size: 12px;
  color: var(--secondary);
  padding: 3px 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.cal-tooltip-type {
  font-size: 9px;
  font-weight: 500;
  padding: 1px 4px;
  border-radius: 3px;
  flex-shrink: 0;
}
.cal-tooltip-link {
  margin-left: auto;
  color: var(--muted);
  display: inline-flex;
  transition: color 0.15s var(--ease);
}
.cal-tooltip-link:hover { color: var(--accent); }
.cal-tooltip-link svg { width: 14px; height: 14px; }

@media (max-width: 500px) {
  .grid { grid-template-columns: 1fr; }
  .search-input { max-width: none; flex: 1 1 100%; }
  h1 { font-size: 20px; }
  .stats { gap: 16px; }
  .cal-cell { min-height: 56px; }
  .cal-entry { font-size: 9px; }
  .cal-month-label { font-size: 16px; }
}
</style>

<div class="wrap">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>Eventos municipais</h1>
        <span class="header-sub">Aniversários, expos agro, rodeios e festivais com shows nacionais</span>
      </div>
      <span class="header-date" id="todayDate"></span>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="lista">Lista</button>
      <button class="tab-btn" data-tab="calendario">Calendário</button>
    </div>
    <div class="filters">
      <select id="filterTipo">
        <option value="">Todos os tipos</option>
        <option value="aniv">Aniversários</option>
        <option value="expo">Expos agro / rodeios</option>
        <option value="fest">Festivais / festas</option>
      </select>
      <select id="filterRegiao">
        <option value="">Todas as regiões</option>
        <option value="N">Norte</option>
        <option value="NE">Nordeste</option>
        <option value="CO">Centro-Oeste</option>
        <option value="SE">Sudeste</option>
        <option value="S">Sul</option>
      </select>
      <select id="filterUF">
        <option value="">Todos os estados</option>
      </select>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar cidade ou evento">
    </div>
    <div class="controls">
      <div class="pill-group" id="proxPills">
        <button class="pill-btn active" data-days="0">Todos</button>
        <button class="pill-btn" data-days="7">7 d</button>
        <button class="pill-btn" data-days="15">15 d</button>
        <button class="pill-btn" data-days="30">30 d</button>
        <button class="pill-btn" data-days="90">90 d</button>
      </div>
      <button class="shows-toggle" id="showsToggle">
        <span class="festa-dot"></span>
        Com shows nacionais
      </button>
    </div>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="view-lista active" id="viewLista">
    <div class="grid" id="grid"></div>
  </div>

  <div class="view-calendario" id="viewCalendario">
    <div class="cal-header">
      <button class="cal-nav" id="calPrev">&larr; Anterior</button>
      <span class="cal-month-label" id="calMonthLabel"></span>
      <button class="cal-nav" id="calNext">Próximo &rarr;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="cal-tooltip" id="calTooltip"></div>
</div>

<script src="dados.js"></script>
<script>
(function(){
  var today = new Date();
  today.setHours(0,0,0,0);
  var MESES_FULL = ["","janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var DIAS_SEM = ["dom","seg","ter","qua","qui","sex","sáb"];
  var TIPO_LABEL = {aniv:"Aniversário",expo:"Expo agro",fest:"Festival"};

  document.getElementById("todayDate").textContent =
    today.getDate() + " de " + MESES_FULL[today.getMonth()+1] + " de " + today.getFullYear();

  function daysUntil(d, m) {
    var y = today.getFullYear();
    var next = new Date(y, m-1, d);
    next.setHours(0,0,0,0);
    if (next < today) next = new Date(y+1, m-1, d);
    return Math.round((next - today) / 86400000);
  }

  var data = EVENTOS.map(function(r) {
    var tipo = r[4];
    var evento = r[5];
    if (!evento && tipo === "aniv") evento = "Aniversário de " + r[0];
    return {
      nome: r[0], uf: r[1], regiao: REGIOES[r[1]], nomeUF: NOMES_UF[r[1]],
      dia: r[2], mes: r[3], tipo: tipo, evento: evento,
      shows: !!r[6], link: r[7] || "",
      diasAte: daysUntil(r[2], r[3]),
      dataFmt: r[2] + " de " + MESES_FULL[r[3]]
    };
  });

  var ufSelect = document.getElementById("filterUF");
  var ufs = [];
  var seen = {};
  data.forEach(function(d){ if(!seen[d.uf]){seen[d.uf]=1;ufs.push(d.uf);} });
  ufs.sort(function(a,b){return NOMES_UF[a].localeCompare(NOMES_UF[b]);});
  ufs.forEach(function(uf) {
    var o = document.createElement("option");
    o.value = uf; o.textContent = NOMES_UF[uf] + " (" + uf + ")";
    ufSelect.appendChild(o);
  });

  var GLOBE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
  function linkIcon(url) { return GLOBE_SVG; }

  var fTipo = "", fRegiao = "", fUF = "", fSearch = "", fProx = 0, fShows = false;
  var grid = document.getElementById("grid");
  var statsBar = document.getElementById("statsBar");

  function getFiltered() {
    var f = data;
    if (fTipo) f = f.filter(function(d){return d.tipo===fTipo;});
    if (fRegiao) f = f.filter(function(d){return d.regiao===fRegiao;});
    if (fUF) f = f.filter(function(d){return d.uf===fUF;});
    if (fSearch) {
      var q = fSearch.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
      f = f.filter(function(d){
        var txt = (d.nome + " " + d.evento).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
        return txt.indexOf(q)>=0;
      });
    }
    if (fProx > 0) f = f.filter(function(d){return d.diasAte<=fProx;});
    if (fShows) f = f.filter(function(d){return d.shows;});
    return f;
  }

  function renderStats(f) {
    var showsCt=0, hojeCt=0, semCt=0, expoCt=0, festCt=0;
    f.forEach(function(d){
      if(d.shows) showsCt++;
      if(d.diasAte===0) hojeCt++;
      else if(d.diasAte<=7) semCt++;
      if(d.tipo==="expo") expoCt++;
      if(d.tipo==="fest") festCt++;
    });
    var s = "<span><strong>"+f.length+"</strong> eventos</span>";
    if(hojeCt) s += '<span class="stat-sep">&middot;</span><span class="stat-today"><strong>'+hojeCt+'</strong> hoje</span>';
    if(semCt) s += '<span class="stat-sep">&middot;</span><span><strong>'+semCt+'</strong> em 7 dias</span>';
    s += '<span class="stat-sep">&middot;</span><span class="stat-shows"><strong>'+showsCt+'</strong> com shows</span>';
    if(expoCt) s += '<span class="stat-sep">&middot;</span><span style="color:var(--expo)"><strong>'+expoCt+'</strong> expos</span>';
    if(festCt) s += '<span class="stat-sep">&middot;</span><span style="color:var(--fest)"><strong>'+festCt+'</strong> festivais</span>';
    statsBar.innerHTML = s;
  }

  function renderList() {
    var f = getFiltered();
    f.sort(function(a,b){return a.diasAte-b.diasAte;});
    renderStats(f);

    if(!f.length){
      grid.innerHTML = '<div class="empty">Nenhum evento encontrado<div class="empty-label">Tente ajustar os filtros</div></div>';
      return;
    }

    var html = "";
    for(var i=0;i<f.length;i++){
      var m = f[i];
      var isToday = m.diasAte===0;
      var isWeek = m.diasAte>0 && m.diasAte<=7;
      var isMonth = m.diasAte>7 && m.diasAte<=30;
      var cls = "card";
      if(isToday) cls+=" is-today";
      else if(isWeek) cls+=" is-week";
      else if(isMonth) cls+=" is-month";
      if(m.shows) cls+=" has-shows";

      var dCls = "days-label";
      var dTxt;
      if(isToday){ dCls+=" today"; dTxt="Hoje"; }
      else if(m.diasAte<=30){ dCls+=" soon"; dTxt=m.diasAte+" d"; }
      else{ dCls+=" later"; dTxt=m.diasAte+" d"; }

      var linkHtml = m.link ?
        '<a class="link-icon" href="'+m.link+'" target="_blank" rel="noopener" title="Página do evento">' + linkIcon(m.link) + '</a>' : '';

      html += '<div class="'+cls+'">' +
        '<div class="card-bar"></div>' +
        '<div class="card-body">' +
          '<div class="card-row-top">' +
            '<span class="city-name">'+m.nome+'</span>' +
            '<span class="'+dCls+'">'+dTxt+'</span>' +
          '</div>' +
          '<div class="event-name">'+m.evento+'</div>' +
          '<div class="card-row-meta">' +
            '<span class="uf-label">'+m.uf+'</span>' +
            '<span class="meta-dot"></span>' +
            '<span>'+NOMES_REGIAO[m.regiao]+'</span>' +
            '<span class="meta-dot"></span>' +
            '<span>'+m.nomeUF+'</span>' +
          '</div>' +
          '<div class="card-row-date">'+m.dataFmt+'</div>' +
          '<span class="type-tag tag-'+m.tipo+'">'+TIPO_LABEL[m.tipo]+'</span>' +
          '<div class="shows-tag"><span class="festa-dot"></span> Shows nacionais</div>' +
          '<div class="card-actions">' +
            linkHtml +
          '</div>' +
        '</div>' +
      '</div>';
    }
    grid.innerHTML = html;
  }

  // Calendar
  var calMonth = today.getMonth();
  var calYear = today.getFullYear();

  function renderCalendar() {
    var f = getFiltered();
    renderStats(f);

    document.getElementById("calMonthLabel").textContent = MESES_FULL[calMonth+1] + " " + calYear;

    var firstDay = new Date(calYear, calMonth, 1).getDay();
    var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();

    var byDay = {};
    f.forEach(function(m){
      if(m.mes === calMonth+1){
        if(!byDay[m.dia]) byDay[m.dia] = [];
        byDay[m.dia].push(m);
      }
    });

    var html = "";
    DIAS_SEM.forEach(function(d){ html += '<div class="cal-dow">'+d+'</div>'; });

    for(var i=0; i<firstDay; i++){
      html += '<div class="cal-cell empty-cell"></div>';
    }

    var todayD = today.getDate(), todayM = today.getMonth(), todayY = today.getFullYear();
    for(var d=1; d<=daysInMonth; d++){
      var isToday = (d===todayD && calMonth===todayM && calYear===todayY);
      var cellCls = "cal-cell" + (isToday ? " is-today-cell" : "");
      html += '<div class="'+cellCls+'" data-day="'+d+'">';
      html += '<div class="cal-day-num">'+d+'</div>';

      if(byDay[d]){
        html += '<div class="cal-entries">';
        var show = Math.min(byDay[d].length, 3);
        for(var j=0; j<show; j++){
          var m = byDay[d][j];
          var label = m.tipo === "aniv" ? m.nome : m.evento;
          html += '<div class="cal-entry cal-'+m.tipo+'" title="'+m.evento+' ('+m.nome+', '+m.uf+')">'+label+'</div>';
        }
        if(byDay[d].length > 3){
          html += '<div class="cal-more">+' + (byDay[d].length - 3) + ' mais</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }

    document.getElementById("calGrid").innerHTML = html;

    document.querySelectorAll(".cal-cell[data-day]").forEach(function(cell){
      cell.addEventListener("click", function(e){
        var day = parseInt(this.dataset.day);
        if(!byDay[day] || !byDay[day].length) { hideTooltip(); return; }
        showTooltip(e, day, byDay[day]);
      });
    });
  }

  var tooltip = document.getElementById("calTooltip");
  function showTooltip(e, day, items){
    var title = day + " de " + MESES_FULL[calMonth+1];
    var h = '<div class="cal-tooltip-title">'+title+' &mdash; '+items.length+' evento'+(items.length>1?'s':'')+'</div>';
    items.forEach(function(m){
      var tColor = m.tipo==="expo"?"var(--expo)":m.tipo==="fest"?"var(--fest)":"var(--accent)";
      var tBg = m.tipo==="expo"?"var(--expo-soft)":m.tipo==="fest"?"var(--fest-soft)":"var(--accent-soft)";
      h += '<div class="cal-tooltip-item">';
      h += '<span class="cal-tooltip-type" style="background:'+tBg+';color:'+tColor+'">'+TIPO_LABEL[m.tipo]+'</span>';
      h += '<span>'+m.nome+'</span>';
      if(m.link) h += '<a class="cal-tooltip-link" href="'+m.link+'" target="_blank" rel="noopener" title="Página do evento">' + linkIcon(m.link) + '</a>';
      h += '</div>';
    });
    tooltip.innerHTML = h;
    tooltip.classList.add("show");

    var rect = e.currentTarget.getBoundingClientRect();
    var tt = tooltip.getBoundingClientRect();
    var x = rect.left + rect.width/2 - tt.width/2;
    var y = rect.bottom + 6;
    if(x < 8) x = 8;
    if(x + tt.width > window.innerWidth - 8) x = window.innerWidth - 8 - tt.width;
    if(y + tt.height > window.innerHeight - 8) y = rect.top - tt.height - 6;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }
  function hideTooltip(){ tooltip.classList.remove("show"); }
  document.addEventListener("click", function(e){
    if(!e.target.closest(".cal-cell") && !e.target.closest(".cal-tooltip")) hideTooltip();
  });

  document.getElementById("calPrev").addEventListener("click", function(){
    calMonth--;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById("calNext").addEventListener("click", function(){
    calMonth++;
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendar();
  });

  // Tabs
  var currentTab = "lista";
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
      this.classList.add("active");
      currentTab = this.dataset.tab;
      document.getElementById("viewLista").classList.toggle("active", currentTab==="lista");
      document.getElementById("viewCalendario").classList.toggle("active", currentTab==="calendario");
      if(currentTab==="calendario") renderCalendar();
      else renderList();
    });
  });

  // Filters
  document.getElementById("filterTipo").addEventListener("change", function(){
    fTipo = this.value;
    if(currentTab==="calendario") renderCalendar(); else renderList();
  });
  document.getElementById("filterRegiao").addEventListener("change", function(){
    fRegiao = this.value;
    var opts = ufSelect.querySelectorAll("option");
    for(var i=0;i<opts.length;i++){
      var o=opts[i];
      if(!o.value){o.style.display="";continue;}
      if(!fRegiao){o.style.display="";continue;}
      o.style.display = REGIOES[o.value]===fRegiao?"":"none";
    }
    if(fUF && fRegiao && REGIOES[fUF]!==fRegiao){fUF="";ufSelect.value="";}
    if(currentTab==="calendario") renderCalendar(); else renderList();
  });
  document.getElementById("filterUF").addEventListener("change",function(){
    fUF=this.value;
    if(currentTab==="calendario") renderCalendar(); else renderList();
  });
  document.getElementById("searchInput").addEventListener("input",function(){
    fSearch=this.value.trim();
    if(currentTab==="calendario") renderCalendar(); else renderList();
  });
  document.getElementById("showsToggle").addEventListener("click",function(){
    fShows=!fShows;
    this.classList.toggle("active",fShows);
    if(currentTab==="calendario") renderCalendar(); else renderList();
  });
  document.querySelectorAll(".pill-btn").forEach(function(btn){
    btn.addEventListener("click",function(){
      document.querySelectorAll(".pill-btn").forEach(function(b){b.classList.remove("active");});
      this.classList.add("active");
      fProx=parseInt(this.dataset.days);
      if(currentTab==="calendario") renderCalendar(); else renderList();
    });
  });

  renderList();
})();
</script>
