<title>Aniversários dos Municípios</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky filter bar, responsive grid of municipality cards sorted by anniversary proximity */
:root {
  --bg: #F7F8FB;
  --surface: #FFFFFF;
  --fg: #1A1D26;
  --muted: #6B7084;
  --line: #E2E4EC;
  --accent: #2563EB;
  --accent-soft: #EBF0FF;
  --festa: #E85D04;
  --festa-soft: #FFF1E6;
  --success: #059669;
  --success-soft: #ECFDF5;
  --tag-bg: #F0F1F5;
  --radius: 10px;
  --display: "Space Grotesk", system-ui, sans-serif;
  --body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1117;
    --surface: #1A1D26;
    --fg: #E8E9ED;
    --muted: #8B8FA3;
    --line: #2A2D3A;
    --accent: #5B8DEF;
    --accent-soft: #1A2744;
    --festa: #FB923C;
    --festa-soft: #2A1A0A;
    --success: #34D399;
    --success-soft: #0A2A1A;
    --tag-bg: #22252F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1117;
  --surface: #1A1D26;
  --fg: #E8E9ED;
  --muted: #8B8FA3;
  --line: #2A2D3A;
  --accent: #5B8DEF;
  --accent-soft: #1A2744;
  --festa: #FB923C;
  --festa-soft: #2A1A0A;
  --success: #34D399;
  --success-soft: #0A2A1A;
  --tag-bg: #22252F;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
* { box-sizing: border-box; }

.header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding: 16px 0 12px;
  border-bottom: 1px solid var(--line);
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}

h1 {
  font-family: var(--display);
  font-size: clamp(1.4rem, 3vw, 1.8rem);
  font-weight: 700;
  margin: 0 0 4px;
  letter-spacing: -0.02em;
}
.subtitle {
  color: var(--muted);
  font-size: 0.875rem;
  margin: 0 0 14px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.filters select, .filters input[type="text"] {
  font-family: var(--body);
  font-size: 0.8125rem;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  outline: none;
  min-width: 0;
}
.filters select:focus, .filters input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
}
.filters select { cursor: pointer; }
.search-input { flex: 1 1 160px; max-width: 280px; }

.toggle-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 8px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.75rem;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: 20px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  user-select: none;
  transition: all 0.15s;
}
.chip.active {
  background: var(--festa-soft);
  color: var(--festa);
  border-color: var(--festa);
}
.chip .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--festa);
}

.stats-bar {
  display: flex;
  gap: 16px;
  padding: 12px 0 8px;
  font-size: 0.8125rem;
  color: var(--muted);
  flex-wrap: wrap;
}
.stats-bar strong {
  color: var(--fg);
  font-weight: 600;
}

.proximity-pills {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.prox-pill {
  font-size: 0.75rem;
  padding: 5px 10px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s;
  font-family: var(--body);
}
.prox-pill.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 10px;
  padding: 12px 0 32px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: box-shadow 0.15s;
  position: relative;
  overflow: hidden;
}
.card:hover {
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.card.is-today {
  border-color: var(--success);
  box-shadow: 0 0 0 2px var(--success-soft);
}
.card.is-soon {
  border-left: 3px solid var(--accent);
}
.card.has-festa .festa-badge {
  display: flex;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.city-name {
  font-family: var(--display);
  font-weight: 600;
  font-size: 1rem;
  line-height: 1.3;
  min-width: 0;
}
.days-badge {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 12px;
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.days-badge.today {
  background: var(--success-soft);
  color: var(--success);
}
.days-badge.soon {
  background: var(--accent-soft);
  color: var(--accent);
}
.days-badge.later {
  background: var(--tag-bg);
  color: var(--muted);
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  color: var(--muted);
  flex-wrap: wrap;
}
.uf-tag {
  font-size: 0.7rem;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--tag-bg);
  color: var(--muted);
  letter-spacing: 0.03em;
}
.regiao-tag {
  font-size: 0.7rem;
  color: var(--muted);
}

.date-line {
  font-size: 0.8125rem;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.date-line span {
  font-weight: 600;
}

.festa-badge {
  display: none;
  align-items: center;
  gap: 4px;
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--festa);
  background: var(--festa-soft);
  padding: 3px 8px;
  border-radius: 12px;
  width: fit-content;
}
.festa-badge svg {
  width: 12px; height: 12px;
  fill: var(--festa);
}

.empty-state {
  text-align: center;
  padding: 48px 16px;
  color: var(--muted);
  font-size: 0.9rem;
  grid-column: 1 / -1;
}
.empty-state .icon { font-size: 2rem; margin-bottom: 8px; }

@media (max-width: 500px) {
  .grid { grid-template-columns: 1fr; }
  .search-input { max-width: none; }
}
</style>

<div class="header">
  <h1>Aniversários dos Municípios</h1>
  <p class="subtitle">Descubra quando cada cidade brasileira comemora seu aniversário</p>
  <div class="filters">
    <select id="filterRegiao">
      <option value="">Todas as regiões</option>
      <option value="N">Norte</option>
      <option value="NE">Nordeste</option>
      <option value="CO">Centro-Oeste</option>
      <option value="SE">Sudeste</option>
      <option value="S">Sul</option>
    </select>
    <select id="filterUF">
      <option value="">Todos os estados</option>
    </select>
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar município...">
  </div>
  <div class="toggle-row">
    <div class="proximity-pills" id="proxPills">
      <button class="prox-pill active" data-days="0">Todos</button>
      <button class="prox-pill" data-days="7">7 dias</button>
      <button class="prox-pill" data-days="15">15 dias</button>
      <button class="prox-pill" data-days="30">30 dias</button>
      <button class="prox-pill" data-days="90">90 dias</button>
    </div>
    <div class="chip" id="festaToggle">
      <span class="dot"></span>
      Apenas com festa agendada
    </div>
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>
<div class="grid" id="grid"></div>

<script src="dados.js"></script>
<script>
(function(){
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayM = today.getMonth()+1;
  const todayD = today.getDate();
  const MESES = ["","Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const MESES_FULL = ["","janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

  function daysUntil(d, m) {
    const thisYear = today.getFullYear();
    let next = new Date(thisYear, m-1, d);
    next.setHours(0,0,0,0);
    if (next < today) next = new Date(thisYear+1, m-1, d);
    return Math.round((next - today) / 86400000);
  }

  const data = MUNICIPIOS.map(([nome, uf, dia, mes, festa]) => ({
    nome, uf,
    regiao: REGIOES[uf],
    nomeUF: NOMES_UF[uf],
    dia, mes, festa: !!festa,
    diasAte: daysUntil(dia, mes),
    dataFmt: dia + " de " + MESES_FULL[mes],
  }));

  // populate UF dropdown sorted
  const ufSelect = document.getElementById("filterUF");
  const ufs = [...new Set(data.map(d=>d.uf))].sort((a,b)=>NOMES_UF[a].localeCompare(NOMES_UF[b]));
  ufs.forEach(uf => {
    const o = document.createElement("option");
    o.value = uf; o.textContent = NOMES_UF[uf] + " (" + uf + ")";
    ufSelect.appendChild(o);
  });

  let filterRegiao = "";
  let filterUF = "";
  let filterSearch = "";
  let filterProx = 0;
  let filterFesta = false;

  const grid = document.getElementById("grid");
  const statsBar = document.getElementById("statsBar");

  function render() {
    let filtered = data;
    if (filterRegiao) filtered = filtered.filter(d => d.regiao === filterRegiao);
    if (filterUF) filtered = filtered.filter(d => d.uf === filterUF);
    if (filterSearch) {
      const q = filterSearch.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
      filtered = filtered.filter(d => {
        const n = d.nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
        return n.includes(q);
      });
    }
    if (filterProx > 0) filtered = filtered.filter(d => d.diasAte <= filterProx);
    if (filterFesta) filtered = filtered.filter(d => d.festa);

    filtered.sort((a,b) => a.diasAte - b.diasAte);

    const festaCount = filtered.filter(d=>d.festa).length;
    const hojeCt = filtered.filter(d=>d.diasAte===0).length;
    const semCt = filtered.filter(d=>d.diasAte>0&&d.diasAte<=7).length;

    statsBar.innerHTML =
      "<span><strong>" + filtered.length + "</strong> municípios</span>" +
      (hojeCt ? "<span>🎂 <strong>" + hojeCt + "</strong> aniversariando hoje</span>" : "") +
      (semCt ? "<span>📅 <strong>" + semCt + "</strong> nos próximos 7 dias</span>" : "") +
      "<span>🎉 <strong>" + festaCount + "</strong> com festa agendada</span>";

    if (!filtered.length) {
      grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>Nenhum município encontrado com esses filtros.</div>';
      return;
    }

    let html = "";
    for (const m of filtered) {
      const isToday = m.diasAte === 0;
      const isSoon = m.diasAte > 0 && m.diasAte <= 7;
      let cls = "card";
      if (isToday) cls += " is-today";
      else if (isSoon) cls += " is-soon";
      if (m.festa) cls += " has-festa";

      let badgeCls = "days-badge";
      let badgeTxt = "";
      if (isToday) { badgeCls += " today"; badgeTxt = "Hoje!"; }
      else if (m.diasAte <= 30) { badgeCls += " soon"; badgeTxt = m.diasAte + " dia" + (m.diasAte>1?"s":""); }
      else { badgeCls += " later"; badgeTxt = m.diasAte + " dias"; }

      html += '<div class="' + cls + '">' +
        '<div class="card-top">' +
          '<span class="city-name">' + m.nome + '</span>' +
          '<span class="' + badgeCls + '">' + badgeTxt + '</span>' +
        '</div>' +
        '<div class="card-meta">' +
          '<span class="uf-tag">' + m.uf + '</span>' +
          '<span class="regiao-tag">' + NOMES_REGIAO[m.regiao] + '</span>' +
        '</div>' +
        '<div class="date-line">Aniversário: <span>' + m.dataFmt + '</span></div>' +
        '<div class="festa-badge">' +
          '<svg viewBox="0 0 16 16"><path d="M8 1.5c-.4 0-.7.3-.7.7v1c0 .4.3.7.7.7s.7-.3.7-.7v-1c0-.4-.3-.7-.7-.7zm4.2 2.3c-.3-.3-.7-.3-1 0l-.7.7c-.3.3-.3.7 0 1s.7.3 1 0l.7-.7c.3-.3.3-.7 0-1zM3.8 3.8c-.3.3-.3.7 0 1l.7.7c.3.3.7.3 1 0s.3-.7 0-1l-.7-.7c-.3-.3-.7-.3-1 0zM8 5.5A4.5 4.5 0 003.5 10c0 1.5.7 2.8 1.8 3.6.3.2.7.4.7.8v.4c0 .4.3.7.7.7h2.6c.4 0 .7-.3.7-.7v-.4c0-.4.4-.6.7-.8A4.48 4.48 0 0012.5 10 4.5 4.5 0 008 5.5z"/></svg>' +
          'Festa agendada' +
        '</div>' +
      '</div>';
    }
    grid.innerHTML = html;
  }

  document.getElementById("filterRegiao").addEventListener("change", function(){
    filterRegiao = this.value;
    // update UF options based on region
    const opts = ufSelect.querySelectorAll("option");
    opts.forEach(o => {
      if (!o.value) { o.style.display = ""; return; }
      if (!filterRegiao) { o.style.display = ""; return; }
      o.style.display = REGIOES[o.value] === filterRegiao ? "" : "none";
    });
    if (filterUF && filterRegiao && REGIOES[filterUF] !== filterRegiao) {
      filterUF = ""; ufSelect.value = "";
    }
    render();
  });
  document.getElementById("filterUF").addEventListener("change", function(){
    filterUF = this.value;
    render();
  });
  document.getElementById("searchInput").addEventListener("input", function(){
    filterSearch = this.value.trim();
    render();
  });
  document.getElementById("festaToggle").addEventListener("click", function(){
    filterFesta = !filterFesta;
    this.classList.toggle("active", filterFesta);
    render();
  });
  document.querySelectorAll(".prox-pill").forEach(btn => {
    btn.addEventListener("click", function(){
      document.querySelectorAll(".prox-pill").forEach(b=>b.classList.remove("active"));
      this.classList.add("active");
      filterProx = parseInt(this.dataset.days);
      render();
    });
  });

  render();
})();
</script>
